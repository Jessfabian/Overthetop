

<section id="reviewWorkbench" hidden></section>
<div class="workbench-shell">

  <!-- STATUS BAR -->

  <header class="workspace-header">

    <div class="workspace-title">

      <h1>Initial Review Workspace</h1>

      <span id="progressText">
        0 of 0 steps complete
      </span>

    </div>

    <div class="workspace-progress">

      <div class="progress-track">

        <div id="progressFill"></div>

      </div>

    </div>

  </header>

  <!-- MAIN LAYOUT -->

  <div class="workspace-layout">

    <!-- SIDEBAR -->

    <aside class="review-sidebar">

      <button
        type="button"
        class="step-btn active"
        data-target="dashboardSection"
      >
        Dashboard
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="caseSetupSection"
      >
        Case Setup
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="stateRequirements"
      >
        State Forms
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="applicationReview"
      >
        Application Review
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="requirementsSection"
      >
        Requirements
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="reviewOutputPackage"
      >
        Output Package
      </button>

      <button
        type="button"
        class="step-btn"
        data-target="emailSection"
      >
        Email
      </button>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="workspace-main">

      <!-- DASHBOARD -->

      <section
        id="dashboardSection"
        class="workspace-card"
      >

        <h2>Case Dashboard</h2>

        <div class="dashboard-grid">

          <div class="stat-card">

            <span class="stat-label">
              State
            </span>

            <span id="dashboardState">
              --
            </span>

          </div>

          <div class="stat-card">

            <span class="stat-label">
              Reviewed
            </span>

            <span id="reviewedCountCard">
              0
            </span>

          </div>

          <div class="stat-card">

            <span class="stat-label">
              Remaining
            </span>

            <span id="remainingCountCard">
              0
            </span>

          </div>

          <div class="stat-card">

            <span class="stat-label">
              NIGOs
            </span>

            <span id="dashboardIssueCount">
              0
            </span>

          </div>

        </div>

      </section>

      <!-- CASE SETUP -->

      <section
        id="caseSetupSection"
        class="workspace-card"
      >

        <h2>Case Setup</h2>

        <div class="case-profile-grid">

          <div>
            Product:
            <span id="profileProduct"></span>
          </div>

          <div>
            State:
            <span id="profileState"></span>
          </div>

          <div>
            BOT:
            <span id="profileBOT"></span>
          </div>

          <div>
            Replacement:
            <span id="profileReplacement"></span>
          </div>

          <div>
            Insured:
            <span id="profileInsured"></span>
          </div>

        </div>

      </section>

      <!-- STATE REQUIREMENTS -->

      <details
        id="stateRequirements"
        class="workspace-card"
      >

        <summary>
          State Requirements
        </summary>

        <div id="stateImportantNotices"></div>

        <div id="stateNotes"></div>

        <div id="requiredForms"></div>

      </details>

      <!-- APPLICATION REVIEW -->

      <section
        id="applicationReview"
        class="workspace-card"
      >
      </section>

      <!-- REQUIREMENTS -->

      <section
        id="requirementsSection"
        class="workspace-card"
      >

        <h2>Requirements</h2>

        <select id="globalRequirementTemplate">
          <option value="">
            Select Requirement
          </option>
        </select>

        <div id="globalRequirementFields"></div>

        <textarea
          id="globalGeneratedRequirement"
          readonly
        ></textarea>

      </section>

      <!-- OUTPUT PACKAGE -->

      <section
        id="reviewOutputPackage"
        class="workspace-card"
      >

        <h2>Review Output Package</h2>

        <textarea
          id="compiledRequirements"
          readonly
        ></textarea>

        <button
          id="copyAllRequirements"
          type="button"
        >
          Copy Requirements
        </button>

      </section>

      <!-- EMAIL -->

      <section
        id="emailSection"
        class="workspace-card"
      >

        <h2>Initial Review Email</h2>

        <div
          id="emailOutput"
          contenteditable="true"
        ></div>

        <button
          id="copyEmail"
          type="button"
        >
          Copy Email
        </button>

      </section>

    </main>

  </div>

</div>
